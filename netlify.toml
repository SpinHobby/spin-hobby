[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Staging: the `staging` branch is deployed as its own Netlify site, https://spin-hobby-staging.netlify.app
# (a branch deploy of the main site would be https://staging--spinhobby.netlify.app). Either way it talks
# to the staging API, never production.
[context.staging.environment]
  VITE_API_URL = "https://spin-hobby-server-staging.onrender.com"
  VITE_APP_ENV = "staging"

# Pull-request previews also use the staging API, so testing a PR can't touch live data.
[context.deploy-preview.environment]
  VITE_API_URL = "https://spin-hobby-server-staging.onrender.com"
  VITE_APP_ENV = "staging"
