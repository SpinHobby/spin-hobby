[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Staging: pushes to the `staging` branch deploy to https://staging--spinhobby.netlify.app
# (enable it under Site configuration > Build & deploy > Branches and deploy contexts >
# Branch deploys: "staging"). It talks to the staging API, never production.
[context.staging.environment]
  VITE_API_URL = "https://spin-hobby-api-staging.onrender.com"
  VITE_APP_ENV = "staging"

# Pull-request previews also use the staging API, so testing a PR can't touch live data.
[context.deploy-preview.environment]
  VITE_API_URL = "https://spin-hobby-api-staging.onrender.com"
  VITE_APP_ENV = "staging"
