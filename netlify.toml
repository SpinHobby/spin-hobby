[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify's image service may shrink Square's product photos (see src/v3/photo.ts).
[images]
  remote_images = ["https://items-images-[a-z]+\\.s3\\.[a-z0-9-]+\\.amazonaws\\.com/.*"]

# Addresses with a page written at build time (scripts/generate-seo.mjs: the home page, sections, categories, series, products)
# are served from it; everything else gets the plain app. index.html is the home page, so it can't be the fallback.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Security headers on every page. frame-ancestors / X-Frame-Options: no other site may show the shop (checkout, admin) inside a
# frame to trick clicks; the shop itself still embeds Square, PayPal and YouTube. Camera and microphone stay allowed for the site
# itself (Admin's barcode scanner, the avatar). No full Content-Security-Policy yet: payments load scripts from several hosts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

# Staging: the `staging` branch is deployed as its own Netlify site, https://spin-hobby-staging.netlify.app
# (a branch deploy of the main site would be https://staging--spinhobby.netlify.app). Either way it talks
# to the staging API, never production.
[context.staging.environment]
  VITE_API_URL = "https://spin-hobby-server-staging.onrender.com"
  VITE_APP_ENV = "staging"

# Pull-request previews also use the staging API, so testing a PR can't touch live data.
[context.deploy-preview.environment]
  VITE_API_URL = "https://spin-hobby-server-staging.onrender.com"
  VITE_APP_ENV = "staging"
