<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/assets/transparent%20mascot%20chibi%20rotated.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1D2A53" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121319" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        var stored = localStorage.getItem("spinhobby-theme");
        var theme =
          stored === "light" || stored === "dark" ? stored : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta
      name="description"
      content="Canada's shop for authentic, officially licensed anime figures, plushies, trading cards and goods. Pre-orders, weekly new arrivals, shipped across Canada and the US."
    />
    <meta property="og:site_name" content="Spin Hobby" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Spin Hobby",
        "alternateName": "Spin Hobby Canada",
        "url": "https://spinhobby.com",
        "logo": "https://spinhobby.com/logo/logo%20cropped.png",
        "description": "Canadian shop for authentic, officially licensed anime figures, plushies, trading cards and goods.",
        "email": "info@spinhobby.com",
        "foundingDate": "2022",
        "areaServed": [
          { "@type": "Country", "name": "Canada" },
          { "@type": "Country", "name": "United States" }
        ],
        "currenciesAccepted": "CAD",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "info@spinhobby.com",
          "availableLanguage": "English"
        },
        "sameAs": ["https://www.instagram.com/spinhobby", "https://www.ebay.ca/usr/spin-hobby", "https://discord.gg/7wGWc7AGcd"]
      }
    </script>
    <!-- Fonts from the v3 design handoff -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="/assets/transparent%20mascot%20chibi%20rotated.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Spin Hobby | Authentic Anime Merch & Figures in Canada</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
